<!doctype html>

    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f3a6d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="QLVB NSG" />
    <link rel="apple-touch-icon" href="/logo.webp" />
    <script>
      // Bắt sớm sự kiện beforeinstallprompt ngay khi trang bắt đầu tải
      window.__deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-available'));
      });
      window.addEventListener('appinstalled', function() {
        window.__deferredPrompt = null;
        window.__isAppInstalled = true;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });
    </script>

    <!-- Primary Meta Tags -->
    <title>Hệ thống Quản lý Văn bản và Điều hành</title>
    <meta name="title" content="Hệ thống Quản lý Văn bản và Điều hành" />
    <meta name="description" content="Hệ thống Quản lý văn bản, điều hành công việc và thi đua khen thưởng" />

    <script>
      // Khôi phục sớm Title, Favicon và Apple Touch Icon từ cấu hình đã lưu trong localStorage để tránh giật lag hoặc hiển thị mặc định cũ
      (function() {
        try {
          var raw = localStorage.getItem('unit_system_config_cache');
          if (raw) {
            var cfg = JSON.parse(raw);
            if (cfg && cfg.siteName) {
              document.title = cfg.siteName;
              var appTitleMeta = document.querySelector("meta[name='apple-mobile-web-app-title']");
              if (appTitleMeta) appTitleMeta.setAttribute('content', cfg.shortName || cfg.siteName);
            }
            var fav = cfg && cfg.favicon;
            var favUrl = '';
            if (fav) {
              if (typeof fav === 'string') favUrl = fav;
              else if (fav.url) favUrl = fav.url;
              else if (fav.fileId) favUrl = 'https://apiqlvb.namsaigon.edu.vn/api/system-config/image/' + fav.fileId;
            }
            if (favUrl) {
              var oldIcons = document.querySelectorAll("link[rel*='icon']");
              oldIcons.forEach(function(el) { el.remove(); });
              var l = document.createElement('link');
              l.rel = 'icon';
              l.href = favUrl;
              document.head.appendChild(l);

              var appleLink = document.querySelector("link[rel='apple-touch-icon']");
              if (!appleLink) {
                appleLink = document.createElement('link');
                appleLink.rel = 'apple-touch-icon';
                document.head.appendChild(appleLink);
              }
              appleLink.href = favUrl;
            }
          }
        } catch(e) {}
      })();
    </script>
